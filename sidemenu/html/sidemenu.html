<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidemenu</title>
  	<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="sidemenu">
  <header class="sidemenu_header">
    <div class="sidemenu_header__logo">
      <div class="sidemenu_header__logo__cancel"><img src="../img/cancel.png" alt="отмена"></div>
      <div class="sidemenu_header__logo__image"><img src="../img/logo.png" alt="логотип"></div>
    </div>
      <div class="sidemenu_header__search"><img src="../img/search.png" alt="поиск"></div>
  </header>
  <div class="sidemenu_list">
    <div class="sidemenu_list_highlight"><img src="../img/highlight.png" alt=""></div>
    <ul class="list">
      <li ><a href="#" class="sidemenu_list__listitem">Ремонт техники</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Услуги и сервисы</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Корпоративным клиентам</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Продавцам техники</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Партнерам</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Производителям</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Наши сервисные центры</a></li>
      <li ><a href="#" class="sidemenu_list__listitem">Контакты</a></li>
    </ul>
  </div>
  <footer class="sidemenu_footer">
    <div class="sidemenu_footer__contacts">
      <div class="sidemenu_footer__contacts__buttons">
        <div class="sidemenu_footer__contacts__call"><img src="../img/call.png" alt="позвонить"></div>
        <div class="sidemenu_footer__contacts__chat"><img src="../img/chat.png" alt="чат"></div>
        <div class="sidemenu_footer__contacts__profile"><img src="../img/profile.png" alt="профиль"></div>
      </div>
        <div class="sidemenu_footer__contacts__mail" ><a href="mailto:mail@cps.com" class="sidemenu_footer__contacts__mail_link">mail@cps.com</a></div>
        <div class="sidemenu_footer__contacts__phonenumber">8 800 890 8900</div>
    </div>
    <div class="sidemenu_footer_lang_selector">
        <a href="#" class="lang-link active">RU</a>
        <a href="#" class="lang-link">EN</a>        
        <a href="#" class="lang-link">CH</a>
    </div>
  </footer>
</body>
